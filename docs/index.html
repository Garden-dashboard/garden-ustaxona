<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Retsept Atlasi</title>
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light only;
  --ground:#FAFAF7; --surface:#FFFFFF; --surface-2:#F1F0E9; --surface-3:#E4E3D9;
  --ink:#20211C; --ink-soft:#5B5C53; --ink-faint:#93948A;
  --accent:#3D6B4C; --accent-deep:#2A4C36; --accent-tint:#E7EFE8;
  --warn:#B5581F; --warn-tint:#F5E3D2;
  --line:rgba(32,33,28,.12); --line-strong:rgba(32,33,28,.24);
  --shadow:0 18px 40px rgba(20,22,16,.12);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14.5px; line-height:1.6;
}
.serif{ font-family:'Source Serif 4',Georgia,serif; }
button{ font-family:inherit; }
h1,h2,h3{ margin:0; text-wrap:balance; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:6px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---------- app shell ---------- */
.app{ display:flex; height:100vh; overflow:hidden; }

/* ---------- sidebar ---------- */
.sidebar{ width:300px; flex:none; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; }
.sb-head{ padding:22px 20px 16px; border-bottom:1px solid var(--line); }
.sb-title{ font-family:'Source Serif 4',Georgia,serif; font-size:20px; font-weight:600; margin-bottom:3px; }
.sb-sub{ font-size:11.5px; color:var(--ink-faint); }
.sb-stats{ display:flex; gap:14px; margin-top:14px; }
.sb-stat{ flex:1; }
.sb-stat b{ display:block; font-family:'Source Serif 4'; font-size:18px; font-weight:600; }
.sb-stat span{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; }
.sb-search{ padding:14px 16px; border-bottom:1px solid var(--line); }
.sb-search input{
  width:100%; font:inherit; font-size:13px; padding:9px 12px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--ground); color:var(--ink); outline:none;
}
.sb-search input:focus{ border-color:var(--accent); }
.sb-groups{ flex:1; overflow-y:auto; padding:8px 0 20px; }
.sb-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  padding:10px 20px; cursor:pointer; font-size:13px; color:var(--ink-soft); border-left:3px solid transparent;
}
.sb-item:hover{ background:var(--surface-2); color:var(--ink); }
.sb-item.active{ background:var(--accent-tint); color:var(--accent-deep); border-left-color:var(--accent); font-weight:600; }
.sb-item .name{ flex:1; }
.sb-item .n{ font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.sb-item.active .n{ color:var(--accent-deep); }

/* ---------- main ---------- */
.main{ flex:1; overflow-y:auto; }
.main-head{
  position:sticky; top:0; z-index:5; background:rgba(250,250,247,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:20px 34px;
  display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.main-head h2{ font-family:'Source Serif 4'; font-size:24px; font-weight:600; }
.main-head .count{ font-size:12.5px; color:var(--ink-faint); }

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; padding:26px 34px 60px; }
.dish-card{
  background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer;
  transition:box-shadow .18s ease, transform .18s ease;
}
.dish-card:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
.dish-card .ph{ aspect-ratio:1/1; background:var(--surface-2); position:relative; overflow:hidden; }
.dish-card .ph img{ width:100%; height:100%; object-fit:cover; }
.dish-card .ph .placeholder{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:11px; text-align:center; padding:10px; }
.dish-card .ph .review-badge{
  position:absolute; top:8px; left:8px; background:var(--warn); color:#fff; font-size:9.5px; font-weight:700;
  letter-spacing:.03em; text-transform:uppercase; padding:3px 7px; border-radius:5px;
}
.dish-card .status-row{ position:absolute; bottom:8px; right:8px; display:flex; gap:5px; }
.status-dot{ width:9px; height:9px; border-radius:50%; border:1.5px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.status-dot.on{ background:var(--accent); }
.status-dot.off{ background:var(--ink-faint); opacity:.55; }
.dish-card .info{ padding:11px 13px 13px; }
.dish-card .name{ font-size:13px; font-weight:600; line-height:1.32; min-height:2.6em; margin-bottom:6px; }
.dish-card .price{ font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }

.empty-state{ padding:80px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px; }

/* ---------- detail panel ---------- */
.panel-overlay{ position:fixed; inset:0; background:rgba(20,22,16,.42); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.panel-overlay.show{ opacity:1; pointer-events:auto; }
.panel{
  position:fixed; top:0; right:0; bottom:0; width:min(560px,94vw); background:var(--surface);
  transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1); overflow-y:auto; z-index:101;
  border-left:1px solid var(--line-strong);
}
.panel-overlay.show .panel{ transform:translateX(0); }
.panel .ph{ aspect-ratio:16/10; background:var(--surface-2); position:relative; }
.panel .ph img{ width:100%; height:100%; object-fit:cover; }
.panel .ph .placeholder{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink-faint); gap:6px; font-size:12.5px; }
.panel-close{
  position:absolute; top:16px; right:16px; width:36px; height:36px; border-radius:50%; border:1px solid var(--line-strong);
  background:rgba(255,255,255,.92); color:var(--ink); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.panel-body{ padding:26px 30px 44px; }
.panel .group-tag{ font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-deep); font-weight:700; }
.panel h3{ font-family:'Source Serif 4'; font-size:25px; font-weight:600; margin:10px 0 6px; }
.panel .price{ font-size:16px; color:var(--ink-soft); font-weight:600; margin-bottom:24px; }

.panel-section{ border-top:1px solid var(--line); padding-top:20px; margin-top:20px; }
.panel-section h4{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; margin-bottom:14px; }
.ing-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.ing-list > li{ padding:9px 12px; background:var(--surface-2); border-radius:7px; font-size:13.5px; }
.ing-main{ display:flex; justify-content:space-between; gap:12px; }
.ing-list .amt{ color:var(--ink-soft); font-variant-numeric:tabular-nums; text-align:right; }
.yield-note{ font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; }
.sub-block{ margin-top:9px; padding:9px 11px; background:var(--surface); border:1px solid var(--line); border-radius:6px; }
.sub-title{ font-size:11px; color:var(--ink-faint); margin-bottom:6px; }
.sub-block ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
.sub-block li{ display:flex; justify-content:space-between; gap:12px; font-size:12.5px; }
.tech-note{ margin-top:14px; font-size:13px; color:var(--ink-soft); line-height:1.6; }
.empty-note{ font-size:13px; color:var(--ink-faint); font-style:italic; }
.video-wrap{ border-radius:8px; overflow:hidden; background:var(--surface-2); }
.video-wrap video, .video-wrap iframe{ width:100%; display:block; aspect-ratio:16/9; border:none; }

@media (max-width:820px){
  .sidebar{ position:fixed; inset:0 auto 0 0; z-index:60; transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow); }
  .sidebar.open{ transform:translateX(0); }
  .main-head{ padding-left:60px; }
  .menu-toggle{ display:flex !important; }
}
.menu-toggle{
  display:none; position:absolute; top:18px; left:16px; width:36px; height:36px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); align-items:center; justify-content:center; cursor:pointer; z-index:10;
}

/* gate */
.gate-overlay{
  position:fixed; inset:0; background:var(--ground); z-index:200; display:flex; align-items:center; justify-content:center;
}
.gate-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:34px; width:100%; max-width:320px; box-shadow:var(--shadow); text-align:center; }
.gate-card h1{ font-family:'Source Serif 4'; font-size:21px; font-weight:600; margin-bottom:18px; }
.gate-card input{ width:100%; font-size:15px; padding:11px 14px; border-radius:8px; border:1.5px solid var(--line-strong); margin-bottom:12px; box-sizing:border-box; outline:none; }
.gate-card button{ width:100%; font-size:14px; font-weight:700; padding:11px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; }
.gate-card .err{ color:var(--warn); font-size:12.5px; margin-bottom:10px; display:none; }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <form class="gate-card" id="gateForm">
    <h1 class="serif">Garden Retsept Atlasi</h1>
    <div class="err" id="gateErr">Parol noto'g'ri</div>
    <input type="password" id="gatePass" placeholder="Parol" autofocus required>
    <button type="submit">Kirish</button>

</div>

<div class="app" id="appRoot" style="display:none;">
  <aside class="sidebar" id="sidebar">

  <main class="main">
    <button class="menu-toggle" id="menuToggle">☰</button>

      <h2 id="mainTitle">Barcha taomlar</h2>
      <span class="count" id="mainCount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel">
    <div class="ph" id="panelPh"></div>
    <button class="panel-close" id="panelClose">✕</button>
    <div class="panel-body">
      <span class="group-tag" id="panelGroup"></span>
      <h3 id="panelName"></h3>

      <div class="panel-section">

      </div>

      <div class="panel-section">
        <h4>Tayyorlash videosi</h4>
        <div id="panelVideo"></div>
      </div>
    </div>
  </div>
</div>

DATA.groups.forEach(g => g.items.forEach(d => allDishes.push({...d, group: g.name})));
const dishById = {};
allDishes.forEach(d => dishById[d.id] = d);

/* sidebar */
const sbGroups = document.getElementById('sbGroups');
function renderSidebar(){
  let html = `<button class="sb-item active" data-group="">
    <span class="name">Barcha taomlar</span><span class="n">${allDishes.length}</span>
  </button>`;
  html += DATA.groups.map(g => `
    <button class="sb-item" data-group="${esc(g.name)}">
      <span class="name">${esc(g.name)}</span><span class="n">${g.items.length}</span>
    </button>`).join('');
  sbGroups.innerHTML = html;
  sbGroups.querySelectorAll('.sb-item').forEach(btn => {
    btn.addEventListener('click', () => selectGroup(btn.dataset.group, btn));
  });
}
renderSidebar();

/* grid rendering */
const grid = document.getElementById('grid');
const mainTitle = document.getElementById('mainTitle');
const mainCount = document.getElementById('mainCount');

function cardHtml(d){
  let phInner;
  if(d.photo){
    phInner = `<img src="${d.photo}" alt="" loading="lazy">`;
  } else if(d.suggestedPhoto){
    phInner = `<img src="${d.suggestedPhoto}" alt="" loading="lazy"><span class="review-badge">Tekshirish kerak</span>`;
  } else {
    phInner = `<div class="placeholder">Surat yo'q</div>`;
  }
  return `<div class="dish-card" data-id="${d.id}">
    <div class="ph">${phInner}
      <div class="status-row">
        <span class="status-dot ${d.ingredients && d.ingredients.length ? 'on':'off'}" title="Tarkibi"></span>
        <span class="status-dot ${d.video ? 'on':'off'}" title="Videosi"></span>
      </div>
    </div>
    <div class="info">
      <div class="name">${esc(d.name)}</div>
      <div class="price">${fmt(d.price)}</div>
    </div>
  </div>`;
}

function renderGrid(list, title){
  mainTitle.textContent = title;
  mainCount.textContent = list.length + ' taom';
  if(!list.length){ grid.innerHTML = '<div class="empty-state">Hech narsa topilmadi.</div>'; return; }
  grid.innerHTML = list.map(cardHtml).join('');
  grid.querySelectorAll('.dish-card').forEach(el => {
    el.addEventListener('click', () => openDetail(dishById[el.dataset.id]));
  });
}
renderGrid(allDishes, 'Barcha taomlar');

function selectGroup(name, btn){
  sbGroups.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value = '';
  if(!name){ renderGrid(allDishes, 'Barcha taomlar'); return; }
  const g = DATA.groups.find(x => x.name === name);
  renderGrid(g.items.map(d => ({...d, group:name})), name);
  document.getElementById('sidebar').classList.remove('open');
}

/* search across all dishes */
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  sbGroups.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  if(!q){ renderGrid(allDishes, 'Barcha taomlar'); return; }
  const hits = allDishes.filter(d => d.name.toLowerCase().includes(q));
  renderGrid(hits, `Qidiruv: "${e.target.value.trim()}"`);
});

/* detail panel */
const panelOverlay = document.getElementById('panelOverlay');
function openDetail(d){
  if(!d) return;
  const ph = document.getElementById('panelPh');
  if(d.photo){
    ph.innerHTML = `<img src="${d.photo}" alt="">`;
  } else if(d.suggestedPhoto){
    ph.innerHTML = `<img src="${d.suggestedPhoto}" alt=""><span class="review-badge" style="position:absolute;top:14px;left:14px;">Tekshirish kerak</span>`;
  } else {
    ph.innerHTML = `<div class="placeholder">📷<br>Surat hali biriktirilmagan</div>`;
  }
  document.getElementById('panelGroup').textContent = d.group;
  document.getElementById('panelName').textContent = d.name;
  document.getElementById('panelPrice').textContent = fmt(d.price);

  const ingEl = document.getElementById('panelIngredients');
  if(d.ingredients && d.ingredients.length){
    const yieldNote = d.recipeYield ? `<div class="yield-note">Retsept: <b>${esc(d.recipeYield)}</b> uchun</div>` : '';
    const rows = d.ingredients.map(i => {
      let sub = '';
      if(i.sub && i.sub.items && i.sub.items.length){
        sub = `<div class="sub-block"><div class="sub-title">Yarim tayyor mahsulot retsepti (<b>${esc(i.sub.yield)}</b> uchun)</div>
          <ul>${i.sub.items.map(s => `<li><span>${esc(s.name)}</span><span class="amt">${esc(s.amount||'')}</span></li>`).join('')}</ul></div>`;
      }
      return `<li><div class="ing-main"><span>${esc(i.name)}</span><span class="amt">${esc(i.amount||'')}</span></div>${sub}</li>`;
    }).join('');
    ingEl.innerHTML = yieldNote + `<ul class="ing-list">${rows}</ul>`;
    if(d.technology){
      ingEl.innerHTML += `<div class="tech-note"><b>Texnologiya:</b> ${esc(d.technology)}</div>`;
    }
  } else {
    ingEl.innerHTML = `<p class="empty-note">Tarkibi hali admin panel orqali kiritilmagan.</p>`;
  }

  const vidEl = document.getElementById('panelVideo');
  if(d.video){
    const isDirectFile = /\.(mp4|webm|mov)(\?|$)/i.test(d.video);
    vidEl.innerHTML = isDirectFile
      ? `<div class="video-wrap"><video src="${d.video}" controls preload="metadata"></video></div>`
      : `<div class="video-wrap"><iframe src="${d.video}" allowfullscreen loading="lazy"></iframe></div>`;
  } else {
    vidEl.innerHTML = `<p class="empty-note">Video hali yuklanmagan.</p>`;
  }

  panelOverlay.classList.add('show');
}
document.getElementById('panelClose').addEventListener('click', () => panelOverlay.classList.remove('show'));
panelOverlay.addEventListener('click', e => { if(e.target === panelOverlay) panelOverlay.classList.remove('show'); });

/* mobile sidebar toggle */
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

/* simple access gate — bu ochiq repo, lekin sahifa mazmuni faqat xodimlar uchun */
const GATE_PASS = '200211';
const gateOverlay = document.getElementById('gateOverlay');
const appRoot = document.getElementById('appRoot');
function unlock(){
  gateOverlay.style.display = 'none';
  appRoot.style.display = '';
}
try{
  if(localStorage.getItem('atlasAuthed') === '1') unlock();
}catch(e){}
document.getElementById('gateForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = document.getElementById('gatePass').value;
  if(val === GATE_PASS){
    try{ localStorage.setItem('atlasAuthed', '1'); }catch(err){}
    unlock();
  } else {
    document.getElementById('gateErr').style.display = 'block';
  }
});
</script>
