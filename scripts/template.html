<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Retsept Atlasi</title>
<meta name="color-scheme" content="light only">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light only;
  /* Olimp Garden brend palitrasi — menyu sayti (menu.olimpgarden.uz) bilan bir xil */
  --cream:#F6F1E1; --cream-2:#EFE6CD; --cream-3:#E6DAB9; --surface:#FFFDF7;
  --ink:#242A1E; --ink-soft:#5C6350; --ink-faint:#95977E;
  --forest:#2E5339; --forest-deep:#1E3A26; --forest-tint:#DEE7DB;
  --gold:#B8894A; --gold-tint:#F1E3CC;
  --line:rgba(36,41,31,.14); --line-strong:rgba(36,41,31,.26);
  --shadow:0 14px 36px rgba(46,42,20,.14);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14.5px; line-height:1.6;
}
.serif{ font-family:'Fraunces',Georgia,serif; }
button{ font-family:inherit; }
h1,h2,h3{ margin:0; text-wrap:balance; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--cream-3); border-radius:6px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---------- app shell ---------- */
.app{ display:flex; height:100vh; overflow:hidden; }

/* ---------- sidebar ---------- */
.sidebar{ width:300px; flex:none; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; }
.sb-head{ padding:20px 20px 16px; border-bottom:1px solid var(--line); }
.sb-brand{ display:flex; align-items:center; gap:11px; margin-bottom:12px; }
.sb-brand img{ width:40px; height:40px; object-fit:contain; flex:none; }
.sb-title{ font-family:'Fraunces',Georgia,serif; font-size:19px; font-weight:600; line-height:1.15; }
.sb-title em{ font-style:italic; color:var(--forest); }
.sb-sub{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
.sb-stats{ display:flex; gap:14px; margin-top:14px; }
.sb-stat{ flex:1; }
.sb-stat b{ display:block; font-family:'Fraunces',Georgia,serif; font-size:19px; font-weight:600; color:var(--forest); }
.sb-stat span{ font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
.sb-search{ padding:14px 16px; border-bottom:1px solid var(--line); }
.sb-search input{
  width:100%; font:inherit; font-size:13px; padding:10px 13px; border-radius:20px; border:1px solid var(--line-strong);
  background:var(--cream); color:var(--ink); outline:none;
}
.sb-search input:focus{ border-color:var(--forest); }
.sb-groups{ flex:1; overflow-y:auto; padding:8px 0 20px; }
.sb-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
  padding:10px 20px; cursor:pointer; font-size:13px; color:var(--ink-soft); border-left:3px solid transparent;
}
.sb-item:hover{ background:var(--cream-2); color:var(--ink); }
.sb-item.active{ background:var(--forest-tint); color:var(--forest-deep); border-left-color:var(--forest); font-weight:700; }
.sb-item .name{ flex:1; }
.sb-item .n{ font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.sb-item.active .n{ color:var(--forest-deep); }

/* ---------- main ---------- */
.main{ flex:1; overflow-y:auto; }
.main-head{
  position:sticky; top:0; z-index:5; background:rgba(246,241,225,.93); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:20px 34px;
  display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.main-head h2{ font-family:'Fraunces',Georgia,serif; font-size:24px; font-weight:600; }
.main-head .count{ font-size:12.5px; color:var(--ink-faint); font-weight:600; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:18px; padding:26px 34px 60px; }
.dish-card{ cursor:pointer; }
.dish-card .ph{
  aspect-ratio:1/1; background:var(--cream-2); position:relative; overflow:hidden;
  border-radius:28px 10px 28px 10px; border:1px solid var(--line);
  transition:transform .2s ease, box-shadow .2s ease;
}
.dish-card:hover .ph{ transform:translateY(-3px); box-shadow:var(--shadow); }
.dish-card .ph img{ width:100%; height:100%; object-fit:cover; }
.dish-card .ph .placeholder{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:11px; text-align:center; padding:10px; }
.dish-card .ph .review-badge{
  position:absolute; top:9px; left:9px; background:var(--gold); color:#2A1C05; font-size:9px; font-weight:800;
  letter-spacing:.03em; text-transform:uppercase; padding:3px 8px; border-radius:20px;
}
.dish-card .status-row{ position:absolute; bottom:9px; right:9px; display:flex; gap:5px; }
.status-dot{ width:9px; height:9px; border-radius:50%; border:1.5px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.status-dot.on{ background:var(--forest); }
.status-dot.off{ background:var(--ink-faint); opacity:.5; }
.dish-card .info{ padding:11px 3px 0; }
.dish-card .name{ font-family:'Fraunces',Georgia,serif; font-size:14px; font-weight:600; line-height:1.3; min-height:2.6em; margin-bottom:5px; }
.dish-card .price{ font-size:12px; color:var(--gold); font-weight:800; font-variant-numeric:tabular-nums; }

.empty-state{ padding:80px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px; }

/* ---------- tex karta paneli ---------- */
.panel-overlay{ position:fixed; inset:0; background:rgba(30,25,10,.5); z-index:100; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.panel-overlay.show{ opacity:1; pointer-events:auto; }
.panel{
  position:fixed; top:0; right:0; bottom:0; width:min(620px,96vw); background:var(--cream);
  transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1); overflow-y:auto; z-index:101;
}
.panel-overlay.show .panel{ transform:translateX(0); }

/* hero surat — tex karta sarlavhasi ustida */
.tc-photo{ position:relative; aspect-ratio:16/10; background:var(--cream-2); overflow:hidden; border-radius:0 0 46px 14px; }
.tc-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
.tc-photo::after{ content:''; position:absolute; inset:0;
  background:linear-gradient(to bottom, rgba(20,16,8,.18) 0%, rgba(20,16,8,0) 34%, rgba(20,16,8,.8) 100%); }
.tc-photo .placeholder{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--ink-faint); gap:6px; font-size:12.5px; }
.tc-badge{
  position:absolute; top:18px; left:18px; z-index:3; width:48px; height:48px; border-radius:50%; padding:6px;
  background:rgba(255,255,255,.22); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  border:1px solid rgba(255,255,255,.55); box-shadow:0 3px 12px rgba(0,0,0,.2), inset 0 1px 1px rgba(255,255,255,.55);
}
.tc-badge img{ width:100%; height:100%; object-fit:contain; display:block; }
.tc-review{
  position:absolute; top:20px; right:66px; z-index:3; background:var(--gold); color:#2A1C05;
  font-size:9.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
  padding:5px 11px; border-radius:20px; box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.tc-cap{ position:absolute; left:22px; right:22px; bottom:18px; z-index:3; color:#fff; }
.tc-eyebrow{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:#E9D9A8; font-weight:800; margin-bottom:7px; }
.tc-title{ font-family:'Fraunces',Georgia,serif; font-size:30px; font-weight:600; line-height:1.12; text-shadow:0 2px 14px rgba(0,0,0,.45); }
.panel-close{
  position:absolute; top:16px; right:16px; z-index:4; width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(255,255,255,.5); background:rgba(20,16,8,.45); backdrop-filter:blur(6px);
  color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

/* chiplar */
.tc-meta{ display:flex; gap:9px; padding:18px 24px 0; flex-wrap:wrap; }
.chip{ font-size:12px; font-weight:700; padding:7px 14px; border-radius:20px; background:var(--cream-2); color:var(--ink-soft); border:1px solid var(--line); white-space:nowrap; }
.chip.gold{ background:var(--gold); color:#2A1C05; border-color:var(--gold); }
.chip.forest{ background:var(--forest); color:var(--cream); border-color:var(--forest); }

/* bo'limlar */
.tc-sec{ padding:24px 24px 0; }
.tc-sec-head{ display:flex; align-items:center; gap:11px; margin-bottom:13px; }
.tc-num{ width:25px; height:25px; border-radius:50%; background:var(--forest); color:var(--cream);
  font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
.tc-sec-title{ font-family:'Fraunces',Georgia,serif; font-size:19px; font-weight:600; line-height:1.25; }
.tc-sec-note{ font-size:11px; color:var(--ink-faint); font-weight:700; margin-left:auto; text-align:right; white-space:nowrap; }

.tc-table{ width:100%; border-collapse:collapse; }
.tc-table tr{ border-bottom:1px solid var(--line); }
.tc-table tr:last-child{ border-bottom:none; }
.tc-table td{ padding:9px 2px; font-size:13.5px; vertical-align:top; }
.tc-table td.qty{ text-align:right; white-space:nowrap; font-weight:700; color:var(--forest-deep); font-variant-numeric:tabular-nums; width:210px; }

.tc-box{ background:var(--cream-2); border:1px solid var(--line); border-radius:18px 6px 18px 6px; padding:13px 17px; }
.tc-box-head{ font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--gold); margin-bottom:5px; }
.tc-box .tc-table td{ font-size:13px; padding:7px 1px; }
.tc-box .tc-table tr{ border-bottom:1px solid rgba(36,41,31,.09); }

.tech-note{ margin-top:13px; padding:13px 16px; background:var(--forest-tint); border-radius:14px 5px 14px 5px; font-size:13px; color:var(--forest-deep); line-height:1.6; }
.empty-note{ font-size:13px; color:var(--ink-faint); font-style:italic; }
.video-wrap{ border-radius:18px 6px 18px 6px; overflow:hidden; background:var(--cream-2); border:1px solid var(--line); }
.video-wrap video, .video-wrap iframe{ width:100%; display:block; aspect-ratio:16/9; border:none; }

.tc-foot{ margin:26px 24px 40px; padding-top:14px; border-top:1px solid var(--line-strong);
  display:flex; justify-content:space-between; gap:14px; font-size:11px; color:var(--ink-faint); flex-wrap:wrap; }
.tc-foot b{ color:var(--ink-soft); }

@media (max-width:820px){
  .sidebar{ position:fixed; inset:0 auto 0 0; z-index:60; transform:translateX(-100%); transition:transform .25s ease; box-shadow:var(--shadow); }
  .sidebar.open{ transform:translateX(0); }
  .main-head{ padding-left:60px; }
  .menu-toggle{ display:flex !important; }
  .tc-title{ font-size:25px; }
  .tc-table td.qty{ width:130px; font-size:12.5px; }
}
.menu-toggle{
  display:none; position:absolute; top:18px; left:16px; width:36px; height:36px; border-radius:10px; border:1px solid var(--line-strong);
  background:var(--surface); align-items:center; justify-content:center; cursor:pointer; z-index:10;
}

/* gate */
.gate-overlay{ position:fixed; inset:0; background:var(--cream); z-index:200; display:flex; align-items:center; justify-content:center; }
.gate-card{ background:var(--surface); border:1px solid var(--line); border-radius:22px 8px 22px 8px; padding:34px; width:100%; max-width:330px; box-shadow:var(--shadow); text-align:center; }
.gate-card img{ width:54px; height:54px; object-fit:contain; margin:0 auto 14px; display:block; }
.gate-card h1{ font-family:'Fraunces',Georgia,serif; font-size:21px; font-weight:600; margin-bottom:18px; }
.gate-card h1 em{ font-style:italic; color:var(--forest); }
.gate-card input{ width:100%; font-size:15px; padding:11px 15px; border-radius:20px; border:1.5px solid var(--line-strong); margin-bottom:12px; box-sizing:border-box; outline:none; background:var(--cream); }
.gate-card button{ width:100%; font-size:14px; font-weight:700; padding:12px; border-radius:20px; border:none; background:var(--forest); color:var(--cream); cursor:pointer; }
.gate-card .err{ color:var(--gold); font-size:12.5px; margin-bottom:10px; display:none; font-weight:700; }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <form class="gate-card" id="gateForm">
    <img src="logo.png" alt="">
    <h1 class="serif">Garden <em>Retsept Atlasi</em></h1>
    <div class="err" id="gateErr">Parol noto'g'ri</div>
    <input type="password" id="gatePass" placeholder="Parol" autofocus required>
    <button type="submit">Kirish</button>
  </form>
</div>

<div class="app" id="appRoot" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-brand">
        <img src="logo.png" alt="">
        <div>
          <div class="sb-title">Garden <em>Retsept Atlasi</em></div>
          <div class="sb-sub">Oshpazlar uchun</div>
        </div>
      </div>
      <div class="sb-stats">
        <div class="sb-stat"><b id="statTotal">—</b><span>Taom</span></div>
        <div class="sb-stat"><b id="statFilled">—</b><span>Tarkibi bor</span></div>
        <div class="sb-stat"><b id="statVideo">—</b><span>Video bor</span></div>
      </div>
    </div>
    <div class="sb-search"><input type="text" id="searchInput" placeholder="Taom qidirish..."></div>
    <div class="sb-groups" id="sbGroups"></div>
  </aside>

  <main class="main">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="main-head">
      <h2 id="mainTitle">Barcha taomlar</h2>
      <span class="count" id="mainCount"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="panel-overlay" id="panelOverlay">
  <div class="panel" id="panelInner"></div>
</div>

<script id="atlas-data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm";
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

document.getElementById('statTotal').textContent = DATA.stats.total;
document.getElementById('statFilled').textContent = DATA.stats.filled;
document.getElementById('statVideo').textContent = DATA.stats.video;

const allDishes = [];
DATA.groups.forEach(g => g.items.forEach(d => allDishes.push({...d, group: g.name})));
const dishById = {};
allDishes.forEach(d => dishById[d.id] = d);

/* sidebar */
const sbGroups = document.getElementById('sbGroups');
function renderSidebar(){
  let html = `<button class="sb-item active" data-group="">
    <span class="name">Barcha taomlar</span><span class="n">${allDishes.length}</span>
  </button>`;
  html += DATA.groups.map(g => `
    <button class="sb-item" data-group="${esc(g.name)}">
      <span class="name">${esc(g.name)}</span><span class="n">${g.items.length}</span>
    </button>`).join('');
  sbGroups.innerHTML = html;
  sbGroups.querySelectorAll('.sb-item').forEach(btn => {
    btn.addEventListener('click', () => selectGroup(btn.dataset.group, btn));
  });
}
renderSidebar();

/* grid rendering */
const grid = document.getElementById('grid');
const mainTitle = document.getElementById('mainTitle');
const mainCount = document.getElementById('mainCount');

function cardHtml(d){
  let phInner;
  if(d.photo){
    phInner = `<img src="${d.photo}" alt="" loading="lazy">`;
  } else if(d.suggestedPhoto){
    phInner = `<img src="${d.suggestedPhoto}" alt="" loading="lazy"><span class="review-badge">Tekshirish kerak</span>`;
  } else {
    phInner = `<div class="placeholder">Surat yo'q</div>`;
  }
  return `<div class="dish-card" data-id="${d.id}">
    <div class="ph">${phInner}
      <div class="status-row">
        <span class="status-dot ${d.ingredients && d.ingredients.length ? 'on':'off'}" title="Tarkibi"></span>
        <span class="status-dot ${d.video ? 'on':'off'}" title="Videosi"></span>
      </div>
    </div>
    <div class="info">
      <div class="name">${esc(d.name)}</div>
      <div class="price">${fmt(d.price)}</div>
    </div>
  </div>`;
}

function renderGrid(list, title){
  mainTitle.textContent = title;
  mainCount.textContent = list.length + ' taom';
  if(!list.length){ grid.innerHTML = '<div class="empty-state">Hech narsa topilmadi.</div>'; return; }
  grid.innerHTML = list.map(cardHtml).join('');
  grid.querySelectorAll('.dish-card').forEach(el => {
    el.addEventListener('click', () => openDetail(dishById[el.dataset.id]));
  });
}
renderGrid(allDishes, 'Barcha taomlar');

function selectGroup(name, btn){
  sbGroups.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value = '';
  if(!name){ renderGrid(allDishes, 'Barcha taomlar'); return; }
  const g = DATA.groups.find(x => x.name === name);
  renderGrid(g.items.map(d => ({...d, group:name})), name);
  document.getElementById('sidebar').classList.remove('open');
}

/* search across all dishes */
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  sbGroups.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  if(!q){ renderGrid(allDishes, 'Barcha taomlar'); return; }
  const hits = allDishes.filter(d => d.name.toLowerCase().includes(q));
  renderGrid(hits, `Qidiruv: "${e.target.value.trim()}"`);
});

/* ---------- tex karta paneli ----------
   Ko'rinish Mastava uchun tasdiqlangan bosma karta bilan bir xil:
   surat ustida sarlavha, chiplar qatori, keyin raqamlangan bo'limlar —
   1) bir porsiyaga ketadigan tarkib, 2..N) har bir yarim tayyor mahsulot (п/ф)
   retsepti alohida, oxirida video va manba qatori. */
const panelOverlay = document.getElementById('panelOverlay');
const panelInner = document.getElementById('panelInner');

function tableRows(items){
  return items.map(i => `<tr><td>${esc(i.name)}</td><td class="qty">${esc(i.amount||'')}</td></tr>`).join('');
}

function openDetail(d){
  if(!d) return;

  let photoInner;
  if(d.photo){
    photoInner = `<img src="${d.photo}" alt="">`;
  } else if(d.suggestedPhoto){
    photoInner = `<img src="${d.suggestedPhoto}" alt=""><span class="tc-review">Tekshirish kerak</span>`;
  } else {
    photoInner = `<div class="placeholder">📷<br>Surat hali biriktirilmagan</div>`;
  }

  const chips = [
    d.recipeYield ? `<span class="chip forest">${esc(d.recipeYield)}</span>` : '',
    `<span class="chip gold">${fmt(d.price)}</span>`,
    d.num ? `<span class="chip">iiko kodi: ${esc(d.num)}</span>` : '',
  ].filter(Boolean).join('');

  let secNum = 0;
  let sections = '';

  if(d.ingredients && d.ingredients.length){
    secNum++;
    sections += `<div class="tc-sec">
      <div class="tc-sec-head">
        <span class="tc-num">${secNum}</span>
        <span class="tc-sec-title">Bir porsiyaga ketadigan tarkib</span>
        <span class="tc-sec-note">iiko tex kartasidan</span>
      </div>
      <table class="tc-table">${tableRows(d.ingredients)}</table>
    </div>`;

    /* har bir yarim tayyor mahsulot (п/ф) — alohida raqamlangan bo'lim */
    d.ingredients.filter(i => i.sub && i.sub.items && i.sub.items.length).forEach(i => {
      secNum++;
      sections += `<div class="tc-sec">
        <div class="tc-sec-head">
          <span class="tc-num">${secNum}</span>
          <span class="tc-sec-title">«${esc(i.name)}»</span>
          ${i.sub.yield ? `<span class="tc-sec-note">Chiqishi: ${esc(i.sub.yield)}</span>` : ''}
        </div>
        <div class="tc-box">
          <div class="tc-box-head">Tarkibiga kiradigan mahsulotlar</div>
          <table class="tc-table">${tableRows(i.sub.items)}</table>
        </div>
      </div>`;
    });

    if(d.technology){
      sections += `<div class="tc-sec"><div class="tech-note"><b>Texnologiya:</b> ${esc(d.technology)}</div></div>`;
    }
  } else {
    sections += `<div class="tc-sec"><p class="empty-note">Tarkibi hali iikodan kelmagan.</p></div>`;
  }

  secNum++;
  let videoInner;
  if(d.video){
    const isDirectFile = /\.(mp4|webm|mov)(\?|$)/i.test(d.video);
    videoInner = isDirectFile
      ? `<div class="video-wrap"><video src="${d.video}" controls preload="metadata"></video></div>`
      : `<div class="video-wrap"><iframe src="${d.video}" allowfullscreen loading="lazy"></iframe></div>`;
  } else {
    videoInner = `<p class="empty-note">Video hali yuklanmagan.</p>`;
  }
  sections += `<div class="tc-sec">
    <div class="tc-sec-head">
      <span class="tc-num">${secNum}</span>
      <span class="tc-sec-title">Tayyorlash videosi</span>
    </div>
    ${videoInner}
  </div>`;

  panelInner.innerHTML = `
    <div class="tc-photo">
      ${photoInner}
      <div class="tc-badge"><img src="logo.png" alt=""></div>
      <button class="panel-close" id="panelClose">✕</button>
      <div class="tc-cap">
        <div class="tc-eyebrow">${esc(d.group)} · Tex karta</div>
        <div class="tc-title">${esc(d.name)}</div>
      </div>
    </div>
    <div class="tc-meta">${chips}</div>
    ${sections}
    <div class="tc-foot">
      <span><b>Olimp Garden</b> · oshxona uchun tex karta</span>
      <span>Manba: iiko tex kartasi</span>
    </div>`;

  panelInner.scrollTop = 0;
  document.getElementById('panelClose').addEventListener('click', () => panelOverlay.classList.remove('show'));
  panelOverlay.classList.add('show');
}
panelOverlay.addEventListener('click', e => { if(e.target === panelOverlay) panelOverlay.classList.remove('show'); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') panelOverlay.classList.remove('show'); });

/* mobile sidebar toggle */
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

/* to'g'ridan-to'g'ri havola: ...?dish=<id> bilan ochilsa, o'sha taomning tex kartasi
   darhol ochiladi — oshpazga bitta taomni yuborish uchun qulay */
function openFromUrl(){
  const id = new URLSearchParams(location.search).get('dish');
  if(id && dishById[id]) openDetail(dishById[id]);
}

/* simple access gate — bu ochiq repo, lekin sahifa mazmuni faqat xodimlar uchun */
const GATE_PASS = '200211';
const gateOverlay = document.getElementById('gateOverlay');
const appRoot = document.getElementById('appRoot');
function unlock(){
  gateOverlay.style.display = 'none';
  appRoot.style.display = '';
  openFromUrl();
}
try{
  if(localStorage.getItem('atlasAuthed') === '1') unlock();
}catch(e){}
document.getElementById('gateForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = document.getElementById('gatePass').value;
  if(val === GATE_PASS){
    try{ localStorage.setItem('atlasAuthed', '1'); }catch(err){}
    unlock();
  } else {
    document.getElementById('gateErr').style.display = 'block';
  }
});
</script>
</body>
